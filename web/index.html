<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tcl 工作台 · 本地会话</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11161d;color:#e7edf4;font:15px/1.65 system-ui,"Microsoft YaHei";padding:36px 5vw;max-width:1440px;margin-inline:auto}
header{display:flex;justify-content:space-between;gap:20px;color:#c4db9c;font-size:12px;letter-spacing:1px}h1{font-size:32px;margin:12px 0}p{color:#afbdcc;margin:8px 0 20px}main{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin:25px 0}
section{background:#19212b;border:1px solid #34404d;border-radius:12px;padding:20px;min-width:0}h2{font-size:15px;font-weight:600;margin:0 0 12px}label{display:block;font-weight:600;margin-bottom:12px}
textarea,pre{width:100%;background:#0e141c;color:#e5eedc;border:1px solid #384452;border-radius:8px;padding:15px;font:14px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
textarea{min-height:380px;resize:vertical}pre{min-height:84px;margin:0 0 20px}#output{min-height:140px}button,.file,.download{font:inherit;font-size:13px;cursor:pointer;padding:9px 12px;border-radius:6px;background:#25323d;color:#dfebf4;border:1px solid #41505e;margin:5px 5px 0 0;display:inline-block;font-weight:400}
button.primary{background:#c9dfa0;color:#192410;border-color:#c9dfa0}button:disabled{opacity:.45;cursor:default}.file input{display:none}.toolbar{display:flex;flex-wrap:wrap;align-items:center}#status{min-height:28px;margin:15px 0 0;color:#c9dfa0}#error{color:#ffb7a5;white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;color:#9eacbc;font-size:12px}footer{display:flex;gap:20px;flex-wrap:wrap}a{color:#9dcabe}
@media(max-width:760px){body{padding:22px 16px}main{grid-template-columns:1fr}h1{font-size:27px}textarea{min-height:300px}section{padding:16px}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header><span>MOONBIT TCL · 0.4.0</span><span>本地运行 · 会话状态保留</span></header>
<h1 id="title">Tcl 工作台</h1><p id="scope"></p>
<main>
<section><label for="input">脚本</label><textarea id="input" name="source" form="download-form" spellcheck="false" aria-describedby="hint"></textarea>
<small id="hint">每次运行共用一个会话，可继续读取变量与调用过程。Ctrl / ⌘ + Enter 运行。</small>
<div class="toolbar"><button id="run" class="primary">运行脚本</button><button id="cancel" disabled>停止并清空</button><button id="reset">清空会话</button><button id="example">载入示例</button><label class="file">导入脚本<input id="import" type="file" accept=".tcl,.txt,text/plain"></label><form id="download-form" action="../download.tcl" method="post"><button id="download" type="submit">下载脚本</button></form></div>
<p id="status" role="status" aria-live="polite">就绪，运行后可查看结果。</p></section>
<section><h2>返回值</h2><pre id="result" aria-label="返回值"></pre><h2>标准输出</h2><pre id="output" aria-label="标准输出"></pre><div id="error" role="alert"></div><small>停止或超时会清空会话；普通脚本错误保留已执行的修改。网页关闭后，会话状态不会保存。</small></section>
</main>
<p><small id="limits"></small></p>
<footer><a href="../README.md">使用说明</a><a href="../FEATURES.md">兼容范围</a><a href="../pkg.generated.mbti">公共 API</a></footer>
<script type="module" src="app.mjs"></script>
</body></html>
